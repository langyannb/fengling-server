# 风铃分享库 Go 网关 (goapi) —— nginx 扩展目录片段
#
# 作用: 把站点的 /api.php 与 /ws 交给 Go 网关(127.0.0.1:9100),
#       /api.php 的其余 action 由 Go 再转给 PHP-FPM, 所以行为与纯 PHP 一致。
#
# 放置位置: 站点的 nginx 扩展/片段目录, 例如宝塔
#   /www/server/panel/vhost/nginx/extension/<站点名>/goapi.conf
# (install.sh 会按 NGINX_EXT_DIR 复制过去并做 nginx -t 守卫)
#
# 🔴 一键回滚(必读):
#   1) 删掉本文件(扩展目录里的 goapi.conf);
#   2) nginx -t && /etc/init.d/nginx reload
#   全站立刻回到纯 PHP —— 因为主 vhost 里的 `location ~ \.php$` 会重新接管 /api.php。
#   回滚不会停掉 goapi 服务, 它只是不再被 nginx 转发(要停服务: systemctl stop fengling-goapi)。
#
# ⚠️ 如果主 vhost 里已经写了 `location = /api.php`, 本文件会导致
#    nginx: [emerg] duplicate location "/api.php"
#    此时请先在主 vhost 里注释掉那一行(install.sh 会先备份主 vhost)。

# ---- /api.php: 全部 action 交给 Go 网关 ----
location = /api.php {
    proxy_pass http://127.0.0.1:9100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # X-Real-IP 由我们设置: goapi 用它还原"真实客户端 IP"(= PHP 侧 fastcgi_param 的 $remote_addr),
    # 否则 Go 看到的 RemoteAddr 恒为 127.0.0.1, 透传给 PHP 的 REMOTE_ADDR 就变了。
    proxy_set_header X-Real-IP $remote_addr;
    # ⚠️ 刻意**不设置** X-Forwarded-For:
    #   客户端自带的 XFF 必须逐字原样透传给 PHP(client_ip() 读的是整串 HTTP_X_FORWARDED_FOR)。
    #   用 $proxy_add_x_forwarded_for 会在结尾追加客户端 IP, 与迁移前不再是同一串。
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization / Accept-Encoding 必须原样带给后端:
    # 前者是鉴权(api.php 读 HTTP_AUTHORIZATION), 后者决定 gzip 由谁压(PHP/Go 自己压)。
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    # 不要向后端传 keep-alive 到客户端的 Connection 语义
    proxy_set_header Connection "";

    # SSE 关键三件套: 不缓冲, 不超时截断
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    client_max_body_size 150m;
    # 后端已经自己 gzip(Content-Encoding: gzip), 这里再压没有意义
    gzip off;
}

# ---- /ws: WebSocket 升级 ----
location = /ws {
    proxy_pass http://127.0.0.1:9100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 同 /api.php: 不改写 X-Forwarded-For
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
}
