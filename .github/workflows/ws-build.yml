name: Go WebSocket build

on:
  push:
    paths:
      - 'ws/**'
      - '.github/workflows/ws-build.yml'
  pull_request:
    paths:
      - 'ws/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o fengling-ws .
      - uses: actions/upload-artifact@v4
        with:
          name: fengling-ws-linux-amd64
          path: ws/fengling-ws
          if-no-files-found: error
