<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>风铃分享库 - 管理后台</title>
<script src="vue.global.prod.js"></script>
<style>
/* ===== Miuix 风格 (小米设计语言: 圆润/柔和/分层) ===== */
[v-cloak] { display: none !important; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #4C6FFF; --primary-soft: rgba(76,111,255,.12);
  --bg: #F2F3F7; --card: #FFFFFF; --card2: #F7F8FC;
  --text: #1A1A2E; --text2: #8A8FA8;
  --danger: #F5455C; --success: #22B07D;
  --radius: 16px; --radius-sm: 10px;
  --shadow: 0 4px 20px rgba(30,40,90,.06);
  --shadow-lg: 0 8px 32px rgba(30,40,90,.12);
}
body { font-family: -apple-system, 'PingFang SC', 'MiSans', sans-serif; background: var(--bg); color: var(--text); }
input, select, textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #E8EAF2; border-radius: var(--radius-sm); font-size: 14px; outline: none; background: var(--card); transition: border .2s; }
input:focus, textarea:focus { border-color: var(--primary); }
button { cursor: pointer; border: none; border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; }
/* 登录 */
.login-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, #EEF2FF 0%, var(--bg) 60%); }
.login-logo { width: 76px; height: 76px; border-radius: 22px; background: linear-gradient(135deg, #4C6FFF, #7B5CFF); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 38px; font-weight: 700; margin-bottom: 16px; box-shadow: 0 12px 30px rgba(76,111,255,.35); }
.login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-sub { color: var(--text2); font-size: 13px; margin-bottom: 30px; }
.login-card { width: 100%; max-width: 360px; background: var(--card); padding: 26px; border-radius: 22px; box-shadow: var(--shadow-lg); }
.login-card input { margin-bottom: 12px; }
.login-err { color: var(--danger); font-size: 13px; margin-bottom: 10px; text-align: center; }
/* 顶栏 */
.admin-page { padding-bottom: 100px; }
.topbar { position: sticky; top: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 14px 16px; display: flex; align-items: center; gap: 10px; z-index: 10; }
.topbar h1 { font-size: 18px; flex: 1; font-weight: 700; }
.topbar .logout { background: none; color: var(--danger); font-size: 13px; }
/* Tab 胶囊 */
.tabs { display: flex; gap: 8px; padding: 10px 16px; background: var(--card); position: sticky; top: 52px; z-index: 9; }
.tab { flex: 1; text-align: center; padding: 9px 0; font-size: 14px; color: var(--text2); background: var(--card2); border-radius: 12px; transition: all .2s; }
.tab.active { color: #fff; background: var(--primary); font-weight: 600; box-shadow: 0 4px 14px rgba(76,111,255,.3); }
/* 统计 */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; }
.stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stat-num { font-size: 26px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text2); margin-top: 3px; }
/* 列表 */
.section { padding: 14px 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-head h2 { font-size: 16px; font-weight: 700; }
.list-item { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
.list-item .icon { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: var(--card2); flex-shrink: 0; }
.list-item .info { flex: 1; min-width: 0; }
.list-item .name { font-size: 15px; font-weight: 600; }
.list-item .meta { font-size: 12px; color: var(--text2); margin-top: 3px; }
.list-item .ops { display: flex; gap: 8px; flex-shrink: 0; }
/* 按钮 */
.btn-primary { background: var(--primary); color: #fff; padding: 12px; width: 100%; font-weight: 600; border-radius: 12px; }
.btn-ghost { background: var(--card2); color: var(--text); padding: 8px 16px; }
.btn-danger { background: rgba(245,69,92,.1); color: var(--danger); padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn-sm { background: var(--primary-soft); color: var(--primary); padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn-green { background: rgba(34,176,125,.12); color: var(--success); padding: 7px 12px; font-size: 13px; border-radius: 9px; }
/* 弹层 (底部滑出) */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; display: flex; align-items: flex-end; }
.modal { width: 100%; background: var(--card); border-radius: 22px 22px 0 0; padding: 22px; max-height: 90vh; overflow-y: auto; animation: slideUp .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h3 { font-size: 17px; margin-bottom: 16px; font-weight: 700; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.form-row { display: flex; gap: 10px; }
.form-row > div { flex: 1; }
.modal-btns { display: flex; gap: 10px; margin-top: 18px; }
.modal-btns .btn-primary, .modal-btns .btn-ghost { flex: 1; }
.empty { text-align: center; color: var(--text2); padding: 40px 0; font-size: 14px; }
.fab { position: fixed; right: 20px; bottom: 28px; width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 28px; box-shadow: 0 8px 24px rgba(76,111,255,.45); z-index: 50; display: flex; align-items: center; justify-content: center; }
/* 网盘链接 */
.link-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--card2); border-radius: var(--radius-sm); margin-bottom: 8px; }
.link-item .info { flex: 1; min-width: 0; font-size: 13px; }
.link-item .info .u { color: var(--text2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 图片上传 */
.upload-box { width: 100%; height: 120px; border: 2px dashed #D8DBE8; border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text2); font-size: 13px; cursor: pointer; overflow: hidden; background: var(--card2); position: relative; }
.upload-box img { width: 100%; height: 100%; object-fit: cover; }
.upload-box .up-tip { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 11px; text-align: center; padding: 4px; }
/* 小徽章 */
.badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; background: var(--primary-soft); color: var(--primary); margin-left: 6px; }
.badge-pack { background: rgba(124,77,255,.12); color: #7C4DFF; }
.badge-off { background: rgba(138,143,168,.12); color: var(--text2); }
/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(26,26,46,.88); color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; z-index: 999; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div id="app" v-cloak></div>

<!-- 应用模板 -->
<script type="text/x-template" id="app-tpl">
<div>
  <!-- 登录页 -->
  <div v-if="!token" class="login-page">
    <div class="login-logo">风</div>
    <div class="login-title">风铃分享库</div>
    <div class="login-sub">管理后台</div>
    <div class="login-card">
      <input v-model="username" placeholder="用户名" @keyup.enter="login">
      <input v-model="password" type="password" placeholder="密码" @keyup.enter="login">
      <div v-if="loginErr" class="login-err">{{loginErr}}</div>
      <button class="btn-primary" @click="login">登 录</button>
    </div>
  </div>

  <!-- 管理页 -->
  <div v-else class="admin-page">
    <div class="topbar">
      <h1>风铃分享库</h1>
      <span style="font-size:13px;color:var(--text2);">{{user}}</span>
      <button class="logout" @click="logout">退出</button>
    </div>

    <div class="tabs">
      <button class="tab" :class="{active: tab==='stats'}" @click="switchTab('stats')">统计</button>
      <button class="tab" :class="{active: tab==='apps'}" @click="switchTab('apps')">软件</button>
      <button class="tab" :class="{active: tab==='banners'}" @click="switchTab('banners')">轮播</button>
      <button class="tab" :class="{active: tab==='cats'}" @click="switchTab('cats')">分类</button>
    </div>

    <!-- 统计 -->
    <div v-if="tab==='stats'" class="stats">
      <div class="stat-card"><div class="stat-num">{{stats.total_apps}}</div><div class="stat-label">软件总数</div></div>
      <div class="stat-card"><div class="stat-num">{{stats.total_downloads}}</div><div class="stat-label">总下载量</div></div>
      <div class="stat-card"><div class="stat-num">{{stats.total_clicks}}</div><div class="stat-label">总点击</div></div>
      <div class="stat-card"><div class="stat-num">{{stats.today_clicks}}</div><div class="stat-label">今日点击</div></div>
      <div class="section" style="grid-column: span 2;">
        <div class="section-head"><h2>热门链接</h2></div>
        <div v-if="!stats.top_links || !stats.top_links.length" class="empty">暂无数据</div>
        <div v-for="l in stats.top_links" :key="l.id" class="list-item">
          <div class="info"><div class="name">{{l.label}}</div></div>
          <div class="meta">{{l.cnt}} 次点击</div>
        </div>
      </div>
    </div>

    <!-- 软件管理 -->
    <div v-if="tab==='apps'" class="section">
      <div v-if="!apps.length" class="empty">暂无软件，点击右下角 + 添加</div>
      <div v-for="app in apps" :key="app.id" class="list-item">
        <img v-if="app.icon" :src="app.icon" class="icon">
        <div v-else class="icon" style="display:flex;align-items:center;justify-content:center;color:var(--primary);font-weight:700;">{{(app.name||'?')[0]}}</div>
        <div class="info">
          <div class="name">{{app.name}}<span v-if="app.is_pack" class="badge badge-pack">整合</span><span v-if="!app.is_active" class="badge badge-off">下架</span></div>
          <div class="meta">{{app.category_name||'未分类'}} · {{app.download_count}}下载</div>
        </div>
        <div class="ops">
          <button class="btn-sm" @click="openApp(app)">编辑</button>
          <button class="btn-danger" @click="delApp(app)">删</button>
        </div>
      </div>
      <button class="fab" @click="openApp()">+</button>
    </div>

    <!-- 轮播管理 -->
    <div v-if="tab==='banners'" class="section">
      <div v-if="!banners.length" class="empty">暂无轮播图，点击右下角 + 添加</div>
      <div v-for="b in banners" :key="b.id" class="list-item">
        <img :src="b.image" class="icon">
        <div class="info">
          <div class="name">{{b.title || '未命名'}}<span v-if="b.app_name" class="badge">→ {{b.app_name}}</span></div>
          <div class="meta">排序 {{b.sort_order}}</div>
        </div>
        <div class="ops">
          <button class="btn-sm" @click="openBanner(b)">编辑</button>
          <button class="btn-danger" @click="delBanner(b)">删</button>
        </div>
      </div>
      <button class="fab" @click="openBanner()">+</button>
    </div>

    <!-- 分类管理 -->
    <div v-if="tab==='cats'" class="section">
      <div v-if="!cats.length" class="empty">暂无分类</div>
      <div v-for="c in cats" :key="c.id" class="list-item">
        <div class="info"><div class="name">{{c.name}}</div></div>
        <div class="ops">
          <button class="btn-sm" @click="editCat(c)">编辑</button>
          <button class="btn-danger" @click="delCat(c)">删</button>
        </div>
      </div>
      <button class="fab" @click="editCat()">+</button>
    </div>

    <!-- 软件编辑弹层 -->
    <div v-if="showApp" class="modal-mask" @click.self="showApp=false">
      <div class="modal">
        <h3>{{appForm.id ? '编辑软件' : '添加软件'}}</h3>
        <div class="form-group"><label>名称 *</label><input v-model="appForm.name" placeholder="软件名"></div>
        <div class="form-row">
          <div class="form-group"><label>分类</label>
            <select v-model="appForm.category_id">
              <option :value="0">未分类</option>
              <option v-for="c in cats" :key="c.id" :value="c.id">{{c.name}}</option>
            </select>
          </div>
          <div class="form-group"><label>版本</label><input v-model="appForm.version" placeholder="1.0"></div>
        </div>
        <div class="form-group"><label>图标 (点击上传)</label>
          <div class="upload-box" @click="pickImage('icon')">
            <img v-if="appForm.icon" :src="appForm.icon">
            <template v-else><span style="font-size:24px;">+</span><span>上传图标</span></template>
            <div v-if="uploading==='icon'" class="up-tip">上传中...</div>
          </div>
        </div>
        <div class="form-group"><label>包名</label><input v-model="appForm.package_name" placeholder="com.example.app"></div>
        <div class="form-group"><label>描述</label><textarea v-model="appForm.description" rows="3" placeholder="软件介绍"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>排序</label><input v-model="appForm.sort_order" type="number"></div>
          <div class="form-group"><label>状态</label>
            <select v-model="appForm.is_active"><option :value="1">上架</option><option :value="0">下架</option></select>
          </div>
        </div>
        <div class="form-group"><label>整合包 (选择后此软件作为整合包的子项)</label>
          <select v-model="appForm.pack_id">
            <option :value="null">独立软件</option>
            <template v-for="a in apps" :key="a.id">
              <option v-if="a.id !== appForm.id && !a.pack_id" :value="a.id">{{a.name}} (整合包)</option>
            </template>
          </select>
        </div>

        <h3 style="margin-top:18px;font-size:15px;">网盘推广链接</h3>
        <div v-for="(link, i) in appForm.links" :key="link._k || i" class="link-item">
          <div class="info">
            <div>{{link.label || '网盘链接'}} <span v-if="link.password">(提取码:{{link.password}})</span><span v-if="link._new" class="badge">新</span></div>
            <div class="u">{{link.url}}</div>
          </div>
          <button class="btn-sm" @click="link._editing = !link._editing">{{link._editing ? '完成' : '改'}}</button>
          <button class="btn-danger" @click="appForm.links.splice(i,1)">删</button>
        </div>
        <button class="btn-ghost" style="width:100%;margin-bottom:8px;" @click="addLink()">+ 添加网盘链接</button>
        <div v-for="link in appForm.links.filter(l=>l._editing)" :key="'e'+link._k" style="background:var(--card2);padding:12px;border-radius:var(--radius-sm);margin-bottom:8px;">
          <div class="form-row">
            <div class="form-group"><label>类型</label>
              <select v-model="link.pan_type">
                <option value="uc">UC网盘</option><option value="quark">夸克</option>
                <option value="baidu">百度</option><option value="ali">阿里</option><option value="other">其他</option>
              </select>
            </div>
            <div class="form-group"><label>名称</label><input v-model="link.label"></div>
          </div>
          <div class="form-group"><label>链接URL *</label><input v-model="link.url" placeholder="https://..."></div>
          <div class="form-group"><label>提取码</label><input v-model="link.password"></div>
        </div>

        <div class="modal-btns">
          <button class="btn-primary" @click="saveApp">保存软件</button>
          <button class="btn-ghost" @click="showApp=false">取消</button>
        </div>
      </div>
    </div>

    <!-- 轮播编辑弹层 -->
    <div v-if="showBanner" class="modal-mask" @click.self="showBanner=false">
      <div class="modal">
        <h3>{{bannerForm.id ? '编辑轮播' : '添加轮播'}}</h3>
        <div class="form-group"><label>图片 (点击上传)</label>
          <div class="upload-box" @click="pickImage('banner')">
            <img v-if="bannerForm.image" :src="bannerForm.image">
            <template v-else><span style="font-size:24px;">+</span><span>上传轮播图</span></template>
            <div v-if="uploading==='banner'" class="up-tip">上传中...</div>
          </div>
        </div>
        <div class="form-group"><label>标题</label><input v-model="bannerForm.title" placeholder="轮播标题"></div>
        <div class="form-group"><label>跳转链接 (填写后优先于关联软件, 内置浏览器打开)</label><input v-model="bannerForm.url" placeholder="https://..."></div>
        <div class="form-group"><label>关联软件 (点击跳转)</label>
          <select v-model="bannerForm.app_id">
            <option :value="null">不关联</option>
            <option v-for="a in apps" :key="a.id" :value="a.id">{{a.name}}</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>排序</label><input v-model="bannerForm.sort_order" type="number"></div>
          <div class="form-group"><label>状态</label>
            <select v-model="bannerForm.is_active"><option :value="1">启用</option><option :value="0">停用</option></select>
          </div>
        </div>
        <div class="modal-btns">
          <button class="btn-primary" @click="saveBanner">保存</button>
          <button class="btn-ghost" @click="showBanner=false">取消</button>
        </div>
      </div>
    </div>

    <!-- 分类编辑弹层 -->
    <div v-if="showCat" class="modal-mask" @click.self="showCat=false">
      <div class="modal">
        <h3>{{catForm.id ? '编辑分类' : '添加分类'}}</h3>
        <div class="form-group"><label>名称 *</label><input v-model="catForm.name" placeholder="分类名"></div>
        <div class="form-group"><label>颜色</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <div v-for="c in colors" :key="c" @click="catForm.color=c" :style="{width:'32px',height:'32px',borderRadius:'10px',background:c,cursor:'pointer',outline: catForm.color===c?'2px solid #333':'none',outlineOffset:'2px'}"></div>
          </div>
        </div>
        <div class="form-group"><label>排序</label><input v-model="catForm.sort_order" type="number"></div>
        <div class="modal-btns">
          <button class="btn-primary" @click="saveCat">保存</button>
          <button class="btn-ghost" @click="showCat=false">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>
</script>

<script>
const { createApp } = Vue;
const store = {
  get token() { return localStorage.getItem('fl_token') || ''; },
  set token(v) { localStorage.setItem('fl_token', v); },
  get user() { return localStorage.getItem('fl_user') || ''; },
  set user(v) { localStorage.setItem('fl_user', v); },
};

createApp({
  template: '#app-tpl',
  data() {
    return {
      token: store.token,
      username: '', password: '', loginErr: '',
      user: store.user,
      tab: 'stats',
      stats: {}, apps: [], cats: [], banners: [],
      showApp: false, showBanner: false, showCat: false,
      uploading: '',
      colors: ['#4C6FFF', '#22B07D', '#FF8F1F', '#FF4D6D', '#7C4DFF', '#00B8D4', '#FFB300', '#F5455C'],
      appForm: { id: 0, name: '', category_id: 0, icon: '', version: '', description: '', package_name: '', sort_order: 0, is_active: 1, pack_id: null, links: [] },
      bannerForm: { id: 0, image: '', title: '', app_id: null, url: '', sort_order: 0, is_active: 1 },
      catForm: { id: 0, name: '', color: '#4C6FFF', sort_order: 0 },
    };
  },
  mounted() {
    if (this.token) { this.loadStats(); this.loadCats(); this.loadBanners(); }
  },
  methods: {
    async api(action, params = {}, method = 'GET') {
      let url = 'api.php?action=' + action;
      const opt = { method, headers: { 'Authorization': 'Bearer ' + this.token } };
      if (method === 'POST') {
        opt.headers['Content-Type'] = 'application/json';
        opt.body = JSON.stringify(params);
      } else {
        const qs = new URLSearchParams(params).toString();
        if (qs) url += '&' + qs;
      }
      let res;
      try {
        res = await fetch(url, opt);
      } catch (e) {
        this.toast('网络错误: ' + e.message);
        return { code: -1, msg: '网络错误' };
      }
      let body;
      try { body = await res.json(); } catch (e) { body = { code: -1, msg: '响应解析失败' }; }
      // 401 (HTTP 或 body): token 失效, 强制重新登录
      if (res.status === 401 || body.code === 401) {
        store.token = ''; this.token = ''; store.user = '';
        this.toast('登录已失效, 请重新登录');
        return { code: 401, msg: '未登录' };
      }
      return body;
    },
    toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1800);
    },
    switchTab(t) {
      this.tab = t;
      if (t === 'stats') this.loadStats();
      if (t === 'apps') this.loadApps();
      if (t === 'banners') this.loadBanners();
      if (t === 'cats') this.loadCats();
    },
    async login() {
      this.loginErr = '';
      if (!this.username || !this.password) { this.loginErr = '请输入用户名和密码'; return; }
      const r = await this.api('login', { username: this.username, password: this.password }, 'POST');
      if (r.code === 0 && r.data && r.data.token) {
        store.token = r.data.token;
        store.user = (r.data.user && r.data.user.username) || this.username;
        this.token = r.data.token;
        this.user = store.user;
        this.toast('登录成功, 欢迎 ' + this.user);
        this.loadStats(); this.loadCats(); this.loadBanners();
      } else {
        this.loginErr = r.msg || '登录失败';
      }
    },
    logout() { store.token = ''; this.token = ''; store.user = ''; this.user = ''; },
    async loadStats() { const r = await this.api('stats'); if (r.code === 0) this.stats = r.data; },
    async loadApps() { const r = await this.api('apps'); if (r.code === 0) this.apps = r.data; },
    async loadBanners() { const r = await fetch('api.php?action=banners').then(x => x.json()); if (r.code === 0) this.banners = r.data; },
    async loadCats() { const r = await fetch('api.php?action=categories').then(x => x.json()); if (r.code === 0) this.cats = r.data; },
    // 图片上传 (直接选文件, 不是填 URL)
    pickImage(target) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        this.uploading = target;
        const fd = new FormData();
        fd.append('file', file);
        try {
          const res = await fetch('api.php?action=upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + this.token },
            body: fd,
          });
          const r = await res.json();
          if (r.code === 0) {
            if (target === 'icon') this.appForm.icon = r.data.url;
            else if (target === 'banner') this.bannerForm.image = r.data.url;
            this.toast('上传成功');
          } else this.toast(r.msg);
        } catch (err) { this.toast('上传失败'); }
        this.uploading = '';
      };
      input.click();
    },
    // 软件
    async openApp(app) {
      this.appForm = {
        id: app ? app.id : 0, name: app ? app.name : '', category_id: app ? (Number(app.category_id) || 0) : 0,
        icon: app ? app.icon : '', version: app ? app.version : '', description: app ? app.description : '',
        package_name: app ? app.package_name : '', sort_order: app ? app.sort_order : 0,
        is_active: app ? Number(app.is_active) : 1, pack_id: app ? (app.pack_id || null) : null,
        links: [],
      };
      this.showApp = true;
      // 编辑已有软件: 异步加载详情(含网盘链接), 否则编辑时链接不可见
      if (app && app.id) {
        try {
          const r = await fetch('api.php?action=app_detail&id=' + app.id).then(x => x.json());
          if (r.code === 0 && r.data) {
            const d = r.data;
            this.appForm = {
              ...this.appForm,
              name: d.name || this.appForm.name,
              icon: d.icon || this.appForm.icon,
              version: d.version || this.appForm.version,
              description: d.description || this.appForm.description,
              package_name: d.package_name || this.appForm.package_name,
              pack_id: d.pack_id || null,
              links: (d.pan_links || []).map(l => ({ ...l, _k: 'l' + l.id + Math.random(), _editing: false })),
            };
            // 记录原始链接 id (用于检测保存时被删除的链接)
            this._origLinkIds = (d.pan_links || []).map(l => l.id);
          }
        } catch (e) { this.toast('详情加载失败'); }
      } else {
        this._origLinkIds = [];
      }
    },
    addLink() {
      this.appForm.links.push({ pan_type: 'uc', label: 'UC网盘', url: '', password: '', _new: true, _k: 'n' + Date.now() + Math.random(), _editing: true });
    },
    async saveApp() {
      const f = this.appForm;
      if (!f.name) { this.toast('请输入软件名'); return; }
      // 已有链接先更新
      for (const link of f.links) {
        if (link.id && !link._new) {
          const r = await this.api('link_update', { id: link.id, pan_type: link.pan_type, label: link.label, url: link.url, password: link.password }, 'POST');
          if (r.code !== 0 && r.code !== 401) { this.toast('链接更新失败: ' + r.msg); return; }
        }
      }
      // 删除被移除的链接 (编辑时链接在但保存前被删掉的情况)
      if (f.id && this._origLinkIds) {
        const keptIds = new Set(f.links.filter(l => l.id).map(l => l.id));
        for (const oldId of this._origLinkIds) {
          if (!keptIds.has(oldId)) {
            await this.api('link_delete', { id: oldId }, 'POST');
          }
        }
      }
      let r;
      if (f.id) {
        r = await this.api('app_update', { id: f.id, name: f.name, category_id: f.category_id || null, icon: f.icon, version: f.version, description: f.description, package_name: f.package_name, sort_order: Number(f.sort_order) || 0, is_active: Number(f.is_active), pack_id: f.pack_id || null }, 'POST');
      } else {
        r = await this.api('app_create', { name: f.name, category_id: f.category_id || null, icon: f.icon, version: f.version, description: f.description, package_name: f.package_name, sort_order: Number(f.sort_order) || 0, pack_id: f.pack_id || null }, 'POST');
        if (r.code === 0 && r.data) f.id = r.data.id;
      }
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      // 新建链接
      for (const link of f.links) {
        if (link._new && link.url) {
          const lr = await this.api('link_create', { app_id: f.id, pan_type: link.pan_type, label: link.label, url: link.url, password: link.password }, 'POST');
          if (lr.code !== 0 && lr.code !== 401) { this.toast('链接保存失败: ' + lr.msg); return; }
        }
      }
      this.showApp = false;
      this.toast('保存成功');
      this.loadApps();
    },
    async delApp(app) {
      if (!confirm('删除软件 ' + app.name + '?')) return;
      await this.api('app_delete', { id: app.id }, 'POST');
      this.loadApps();
    },
    // 轮播
    openBanner(b) {
      if (b) {
        this.bannerForm = { ...b, app_id: b.app_id || null };
      } else {
        this.bannerForm = { id: 0, image: '', title: '', app_id: null, url: '', sort_order: 0, is_active: 1 };
      }
      this.showBanner = true;
    },
    async saveBanner() {
      const f = this.bannerForm;
      if (!f.image) { this.toast('请上传图片'); return; }
      let r;
      if (f.id) {
        r = await this.api('banner_update', { id: f.id, image: f.image, title: f.title, app_id: f.app_id || null, url: f.url || '', sort_order: Number(f.sort_order) || 0, is_active: Number(f.is_active) }, 'POST');
      } else {
        r = await this.api('banner_create', { image: f.image, title: f.title, app_id: f.app_id || null, url: f.url || '', sort_order: Number(f.sort_order) || 0, is_active: Number(f.is_active) }, 'POST');
      }
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.showBanner = false;
      this.toast('保存成功');
      this.loadBanners();
    },
    async delBanner(b) {
      if (!confirm('删除该轮播?')) return;
      await this.api('banner_delete', { id: b.id }, 'POST');
      this.loadBanners();
    },
    // 分类
    editCat(c) {
      this.catForm = c ? { ...c } : { id: 0, name: '', color: '#4C6FFF', sort_order: 0 };
      this.showCat = true;
    },
    async saveCat() {
      const f = this.catForm;
      if (!f.name) { this.toast('请输入分类名'); return; }
      let r;
      if (f.id) {
        r = await this.api('category_update', { id: f.id, name: f.name, color: f.color, sort_order: Number(f.sort_order) || 0 }, 'POST');
      } else {
        r = await this.api('category_create', { name: f.name, color: f.color, sort_order: Number(f.sort_order) || 0 }, 'POST');
      }
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.showCat = false;
      this.toast('保存成功');
      this.loadCats();
    },
    async delCat(c) {
      if (!confirm('删除分类 ' + c.name + '?')) return;
      await this.api('category_delete', { id: c.id }, 'POST');
      this.loadCats();
    },
  },
}).mount('#app');
</script>
</body>
</html>
