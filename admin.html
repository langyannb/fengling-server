<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>风铃分享库 - 管理后台</title>
<script src="vue.global.prod.js"></script>
<style>
/* ===== OShin 液态玻璃风格 (风铃管理后台) ===== */
[v-cloak] { display: none !important; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #4C6FFF; --primary-soft: rgba(76,111,255,.12);
  --bg: #EEF1FA; --card: rgba(255,255,255,.88); --card2: rgba(76,111,255,.07);
  --text: #1A1A2E; --text2: #6E748C;
  --danger: #F5455C; --success: #22B07D;
  --radius: 18px; --radius-sm: 12px;
  --shadow: 0 8px 32px rgba(30,40,90,.08);
  --shadow-lg: 0 16px 48px rgba(30,40,90,.14);
  --glass: rgba(255,255,255,.86);
  --glass-border: rgba(255,255,255,.65);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1017; --card: rgba(255,255,255,.09); --card2: rgba(255,255,255,.05);
    --text: #ECECF2; --text2: #A9AFC4;
    --glass: rgba(28,30,42,.86);
    --glass-border: rgba(255,255,255,.09);
    --shadow: 0 8px 32px rgba(0,0,0,.4);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
  }
}
body { font-family: -apple-system, 'PingFang SC', 'MiSans', 'HarmonyOS Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
/* 背景氛围光 */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(560px 320px at 15% -5%, rgba(76,111,255,.16), transparent 70%),
    radial-gradient(480px 300px at 95% 15%, rgba(124,77,255,.13), transparent 70%),
    radial-gradient(420px 340px at 50% 105%, rgba(34,176,125,.09), transparent 70%);
}
input, select, textarea { width: 100%; padding: 13px 16px; border: 1.5px solid transparent; border-radius: var(--radius-sm); font-size: 15px; outline: none; background: var(--card2); color: var(--text); transition: border .2s, background .2s; }
input:focus, textarea:focus { border-color: var(--primary); background: var(--card); }
input::placeholder, textarea::placeholder { color: var(--text2); opacity: .7; }
button { cursor: pointer; border: none; border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; }
/* ===== 登录页 ===== */
.login-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.login-logo { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(135deg, #4C6FFF, #7B5CFF); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 42px; font-weight: 700; margin-bottom: 18px; box-shadow: 0 16px 40px rgba(76,111,255,.4); position: relative; overflow: hidden; }
.login-logo::after { content: ''; position: absolute; top: -30%; left: -30%; width: 70%; height: 70%; background: rgba(255,255,255,.25); border-radius: 50%; filter: blur(2px); }
.login-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; letter-spacing: 1px; }
.login-sub { color: var(--text2); font-size: 13px; margin-bottom: 32px; }
.login-card { width: 100%; max-width: 380px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 30px 26px; border-radius: 26px; box-shadow: var(--shadow-lg); border: 1px solid var(--glass-border); }
.login-card input { margin-bottom: 14px; }
.login-err { color: var(--danger); font-size: 13px; margin-bottom: 10px; text-align: center; }
/* ===== 顶栏 ===== */
.admin-page { padding-bottom: 108px; }
.topbar { position: sticky; top: 0; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 16px 20px; display: flex; align-items: center; gap: 10px; z-index: 10; border-bottom: 1px solid var(--glass-border); }
.topbar h1 { font-size: 19px; flex: 1; font-weight: 800; letter-spacing: .5px; }
.topbar .user-chip { font-size: 12px; color: var(--text2); background: var(--card2); padding: 4px 12px; border-radius: 20px; }
.topbar .logout { background: var(--card2); color: var(--danger); font-size: 13px; padding: 6px 14px; border-radius: 20px; }
/* ===== 子 tab 胶囊 (页面内切换) ===== */
.sub-tabs { display: flex; gap: 8px; padding: 14px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tab { flex-shrink: 0; padding: 9px 20px; font-size: 14px; color: var(--text2); background: var(--card); border: 1px solid var(--glass-border); border-radius: 14px; transition: all .2s; }
.sub-tab.active { color: #fff; background: var(--primary); font-weight: 600; box-shadow: 0 6px 18px rgba(76,111,255,.35); }
/* ===== 统计 ===== */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px; }
.stat-card { background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: -40%; right: -20%; width: 80%; height: 80%; border-radius: 50%; background: linear-gradient(135deg, rgba(76,111,255,.14), rgba(124,77,255,.06)); }
.stat-num { font-size: 30px; font-weight: 800; color: var(--primary); position: relative; }
.stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; position: relative; }
.rank { width: 24px; height: 24px; border-radius: 8px; background: var(--card2); color: var(--primary); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.list-item:first-child .rank, .list-item:nth-child(2) .rank, .list-item:nth-child(3) .rank { background: linear-gradient(135deg, #4C6FFF, #7B5CFF); color: #fff; }
/* ===== 区块 & 列表 ===== */
.section { padding: 14px 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-head h2 { font-size: 16px; font-weight: 700; }
.list-item { background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 15px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; transition: transform .15s; }
.list-item:active { transform: scale(.985); }
.list-item .icon { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; background: var(--card2); flex-shrink: 0; }
.list-item .info { flex: 1; min-width: 0; }
.list-item .name { font-size: 15px; font-weight: 600; }
.list-item .meta { font-size: 12px; color: var(--text2); margin-top: 3px; }
.list-item .ops { display: flex; gap: 8px; flex-shrink: 0; }
/* ===== 按钮 ===== */
.btn-primary { background: linear-gradient(135deg, #4C6FFF, #6E5CFF); color: #fff; padding: 13px; width: 100%; font-weight: 700; border-radius: 14px; box-shadow: 0 6px 20px rgba(76,111,255,.35); transition: transform .15s, box-shadow .15s; }
.btn-primary:active { transform: scale(.98); box-shadow: 0 3px 10px rgba(76,111,255,.3); }
.btn-ghost { background: var(--card2); color: var(--text); padding: 9px 16px; border: 1px solid var(--glass-border); }
.btn-danger { background: rgba(245,69,92,.1); color: var(--danger); padding: 8px 13px; font-size: 13px; border-radius: 10px; }
.btn-sm { background: var(--primary-soft); color: var(--primary); padding: 8px 13px; font-size: 13px; border-radius: 10px; font-weight: 600; }
.btn-green { background: rgba(34,176,125,.12); color: var(--success); padding: 8px 13px; font-size: 13px; border-radius: 10px; }
/* ===== 弹层 (底部滑出玻璃) ===== */
.modal-mask { position: fixed; inset: 0; background: rgba(10,12,25,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: flex-end; }
.modal { width: 100%; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 26px 26px 0 0; padding: 26px 24px calc(24px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; animation: slideUp .3s cubic-bezier(.2,.8,.2,1); }
@keyframes slideUp { from { transform: translateY(80px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h3 { font-size: 18px; margin-bottom: 18px; font-weight: 800; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 8px; font-weight: 600; }
.form-row { display: flex; gap: 12px; }
.form-row > div { flex: 1; min-width: 0; }
/* 表单分组小标题 */
.form-sec { font-size: 13px; font-weight: 700; color: var(--primary); margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
.form-sec::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--primary-soft), transparent); }
.form-tip { font-size: 12px; color: var(--text2); line-height: 1.6; background: var(--card2); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.modal-btns .btn-primary, .modal-btns .btn-ghost { flex: 1; }
.empty { text-align: center; color: var(--text2); padding: 44px 0; font-size: 14px; }
/* ===== 底部玻璃导航 ===== */
.bottom-nav { position: fixed; left: 14px; right: 14px; bottom: calc(12px + env(safe-area-inset-bottom)); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--shadow-lg); display: flex; padding: 7px; z-index: 100; }
.bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 18px; font-size: 10.5px; color: var(--text2); background: transparent; transition: all .2s; }
.bottom-nav button .ic { font-size: 21px; line-height: 1; filter: grayscale(.6); opacity: .75; transition: all .2s; }
.bottom-nav button.active { color: var(--primary); font-weight: 700; background: var(--primary-soft); }
.bottom-nav button.active .ic { filter: none; opacity: 1; transform: translateY(-1px); }
.fab { position: fixed; right: 20px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #4C6FFF, #7B5CFF); color: #fff; font-size: 30px; box-shadow: 0 10px 28px rgba(76,111,255,.45); z-index: 50; display: flex; align-items: center; justify-content: center; }
/* ===== 网盘链接 ===== */
.link-item { display: flex; align-items: center; gap: 10px; padding: 13px; background: var(--card2); border-radius: var(--radius-sm); margin-bottom: 8px; }
.link-item .info { flex: 1; min-width: 0; font-size: 13px; }
.link-item .info .u { color: var(--text2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ===== 图片上传 ===== */
.upload-box { width: 100%; height: 120px; border: 2px dashed rgba(120,130,160,.35); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text2); font-size: 13px; cursor: pointer; overflow: hidden; background: var(--card2); position: relative; transition: border .2s; }
.upload-box:hover, .upload-box:active { border-color: var(--primary); }
.upload-box img { width: 100%; height: 100%; object-fit: cover; }
.upload-box .up-tip { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; text-align: center; padding: 4px; }
/* ===== 徽章 ===== */
.badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; background: var(--primary-soft); color: var(--primary); margin-left: 6px; font-weight: 600; }
.badge-pack { background: rgba(124,77,255,.12); color: #7C4DFF; }
.badge-off { background: rgba(138,143,168,.12); color: var(--text2); }
/* ===== Toast ===== */
.toast { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); background: rgba(20,22,38,.92); backdrop-filter: blur(12px); color: #fff; padding: 11px 22px; border-radius: 14px; font-size: 13px; z-index: 999; animation: fadeIn .25s; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
@keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
/* ===== 富文本编辑器 ===== */
.editor-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px; background: var(--card2); border: 1.5px solid transparent; border-bottom: none; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
.etb { width: 38px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--glass-border); border-radius: 9px; font-size: 14px; color: var(--text); }
.etb:active { background: var(--primary-soft); }
.etb-color { width: 38px; height: 36px; padding: 0; border: 1px solid var(--glass-border); border-radius: 9px; background: var(--card); cursor: pointer; }
.editor-area { min-height: 160px; max-height: 320px; overflow-y: auto; background: var(--card2); border: 1.5px solid transparent; border-radius: 0 0 var(--radius-sm) var(--radius-sm); padding: 13px 15px; font-size: 14px; line-height: 1.7; outline: none; }
.editor-area:focus { border-color: var(--primary); }
.editor-area img { max-width: 100%; border-radius: 8px; }
.editor-area a { color: var(--primary); }
.editor-area ul, .editor-area ol { padding-left: 22px; }
.editor-area:empty::before { content: attr(placeholder); color: var(--text2); pointer-events: none; }
</style>
</head>
<body>
<div id="app" v-cloak></div>

<!-- 应用模板 -->
<script type="text/x-template" id="app-tpl">
<div>
  <!-- 登录页 -->
  <div v-if="!token" class="login-page">
    <div class="login-logo">风</div>
    <div class="login-title">风铃分享库</div>
    <div class="login-sub">管理后台</div>
    <div class="login-card">
      <input v-model="username" placeholder="用户名" @keyup.enter="login">
      <input v-model="password" type="password" placeholder="密码" @keyup.enter="login">
      <div v-if="loginErr" class="login-err">{{loginErr}}</div>
      <button class="btn-primary" @click="login">登 录</button>
    </div>
  </div>

  <!-- 管理页 -->
  <div v-else class="admin-page">
    <div class="topbar">
      <h1>风铃分享库</h1>
      <span class="user-chip">{{user}}</span>
      <button class="logout" @click="logout">退出</button>
    </div>

    <!-- 主内容 (按底部导航分组) -->
    <div class="content-wrap">

    <!-- 发布组 (版本 + 公告) -->
    <div v-if="mainTab==='publish'">
      <div class="sub-tabs">
        <button class="sub-tab" :class="{active: tab==='version'}" @click="switchTab('version')">📦 版本发布</button>
        <button class="sub-tab" :class="{active: tab==='notice'}" @click="switchTab('notice')">📢 公告</button>
      </div>

    <!-- 版本发布 -->
    <div v-if="tab==='version'" class="section">
      <div class="section-head"><h2>版本发布</h2></div>
      <div class="form-group"><label>版本号</label><input v-model="verForm.version" placeholder="1.0.1"></div>
      <div class="form-group"><label>APK 文件 (上传, 或下方填外链)</label>
        <div class="upload-box" @click="pickApk">
          <template v-if="!verForm.url"><span style="font-size:24px;">+</span><span>上传 APK</span></template>
          <template v-else><span style="font-size:20px;">✅</span><span style="word-break:break-all;">{{verForm.url}}</span></template>
          <div v-if="uploading==='apk'" class="up-tip">上传中...</div>
        </div>
      </div>
      <div class="form-group"><label>外链下载地址 (不传 APK 时填, 如网盘/网页链接)</label><input v-model="verForm.url" placeholder="https://..."></div>
      <div class="form-group"><label>更新日志</label><textarea v-model="verForm.update_log" rows="4" placeholder="更新内容，每行一条"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>更新方式</label>
          <select v-model="verForm.update_mode">
            <option value="internal">内置更新 (App 内置浏览器)</option>
            <option value="external">外置更新 (系统浏览器)</option>
          </select>
        </div>
        <div class="form-group"><label>强制更新</label>
          <select v-model="verForm.force_update">
            <option :value="1">🔒 强制 (用户必须更新)</option>
            <option :value="0">非强制 (可稍后)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>APK 大小 (MB)</label><input v-model="verForm.size_mb" type="number" step="0.1" placeholder="12.5"></div>
        <div class="form-group"><label>发布日期</label><input v-model="verForm.release_date" type="date"></div>
      </div>
      <div class="modal-btns">
        <button class="btn-primary" @click="saveVersion">发布版本</button>
        <button class="btn-ghost" @click="loadVersion">重置</button>
      </div>
    </div>


    <!-- 公告配置 -->
    <div v-if="tab==='notice'" class="section">
      <div class="section-head"><h2>公告设置</h2></div>
      <div class="form-group"><label>公告内容 (富文本编辑器, 支持加粗/颜色/链接/图片)</label>
        <div class="editor-toolbar">
          <button type="button" class="etb" @click="execCmd('bold')" title="加粗"><b>B</b></button>
          <button type="button" class="etb" @click="execCmd('italic')" title="斜体"><i>I</i></button>
          <button type="button" class="etb" @click="execCmd('underline')" title="下划线"><u>U</u></button>
          <button type="button" class="etb" @click="execCmd('insertUnorderedList')" title="无序列表">•≡</button>
          <button type="button" class="etb" @click="execCmd('insertOrderedList')" title="有序列表">1≡</button>
          <button type="button" class="etb" @click="insertLink" title="插入链接">🔗</button>
          <button type="button" class="etb" @click="insertNoticeImage" title="插入图片">🖼</button>
          <input type="color" value="#4C6FFF" class="etb-color" @change="execCmd('foreColor', $event.target.value)" title="文字颜色">
          <button type="button" class="etb" @click="execCmd('removeFormat')" title="清除格式">T̶</button>
        </div>
        <div contenteditable="true" class="editor-area" id="noticeEditor" @input="onNoticeInput" placeholder="输入公告内容..."></div>
        <div style="font-size:11px;color:var(--text2);margin-top:4px;">链接需以 http:// 或 https:// 开头, App 端点击链接会打开内置浏览器。</div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>显示频率</label>
          <select v-model="noticeForm.mode">
            <option value="daily">每日显示一次</option>
            <option value="every">每次打开都显示</option>
          </select>
        </div>
        <div class="form-group"><label>状态</label>
          <select v-model="noticeForm.enabled">
            <option :value="1">✅ 启用</option>
            <option :value="0">停用</option>
          </select>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:14px;">App 端会显示「今日不再提示」复选框, 勾选后当天不再弹出 (每日模式下)。</div>
      <div class="modal-btns">
        <button class="btn-primary" @click="saveNotice">保存公告</button>
        <button class="btn-ghost" @click="loadNotice">重置</button>
      </div>
    </div>

    </div>

    <!-- 设置组 (关于 + 投稿) -->
    <div v-if="mainTab==='settings'">
      <div class="sub-tabs">
        <button class="sub-tab" :class="{active: tab==='about'}" @click="switchTab('about')">⚙️ 关于</button>
        <button class="sub-tab" :class="{active: tab==='contrib'}" @click="switchTab('contrib')">🙋 投稿</button>
        <button class="sub-tab" :class="{active: tab==='crash'}" @click="switchTab('crash')">💥 崩溃</button>
        <button class="sub-tab" :class="{active: tab==='harm'}" @click="switchTab('harm')">🔕 和谐</button>
      </div>

    <!-- 关于配置 -->
    <div v-if="tab==='about'" class="section">
      <div class="section-head"><h2>关于页配置 (官方频道)</h2></div>
      <div class="form-group"><label>横幅标题</label><input v-model="aboutForm.banner_text" placeholder="风铃分享库 · 官方频道"></div>
      <div class="form-group"><label>横幅副标题</label><input v-model="aboutForm.banner_sub" placeholder="最新软件 · 更新通知 · 交流反馈"></div>
      <div class="form-group"><label>QQ 群号</label><input v-model="aboutForm.qq_group" placeholder="740266099"></div>
      <div class="form-group"><label>QQ 加群 Key (mqqapi 用)</label><input v-model="aboutForm.qq_key" placeholder="可选"></div>
      <div class="form-group"><label>QQ 加群网页链接</label><input v-model="aboutForm.qq_url" placeholder="http://qm.qq.com/cgi-bin/qm/qr?..."></div>
      <div class="form-group"><label>官网链接</label><input v-model="aboutForm.website" placeholder="https://..."></div>
      <div class="form-group"><label>GitHub 链接</label><input v-model="aboutForm.github" placeholder="https://github.com/..."></div>
      <div class="form-group"><label>反馈链接</label><input v-model="aboutForm.feedback" placeholder="https://..."></div>
      <div class="form-group"><label>捐赠链接</label><input v-model="aboutForm.donate" placeholder="https://..."></div>
      <div class="modal-btns">
        <button class="btn-primary" @click="saveAbout">保存配置</button>
        <button class="btn-ghost" @click="loadAbout">重置</button>
      </div>
    </div>

    <!-- 投稿名单管理 -->
    <div v-if="tab==='contrib'" class="section">
      <div class="section-head"><h2>投稿名单</h2></div>

      <div style="font-size:12px;color:var(--text2);margin-bottom:14px;">App 端每次启动会把上次崩溃的堆栈自动上传到这里 (含设备/系统/App 版本)。</div>

            <pre style="background:#f5f5f7;border-radius:8px;padding:10px;font-size:11px;line-height:1.5;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-all;color:#333;">{{c.stack}}</pre>

    <!-- 反馈和谐 (App 端「反馈和谐」提交) -->
    <div v-if="tab==='harm'" class="section">
      <div class="section-head"><h2>反馈和谐</h2>
        <button class="btn-sm" style="padding:0 20px;font-size:14px;" @click="loadHarmReports">🔄 刷新</button>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:14px;">App 端用户提交的「哪里被和谐了」反馈 (软件/说明/IP/联系方式)，处理完点「已处理」。</div>

      <div v-for="h in harms" :key="h.id" class="list-item" style="align-items:flex-start;" :style="h.status==1 ? 'opacity:.55' : ''">
        <div class="info" style="flex:1;min-width:0;">
          <div class="name">
            {{h.app_name || '未知软件'}}
            <span style="font-weight:normal;font-size:12px;color:var(--text2);">{{h.created_at}} · IP {{h.ip || '?'}}</span>
            <span v-if="h.status==1" style="margin-left:6px;font-size:11px;color:#16a34a;border:1px solid #16a34a;border-radius:4px;padding:0 6px;">已处理</span>
          </div>
          <div style="font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-all;">{{h.content}}</div>
          <div v-if="h.contact" style="font-size:12px;color:var(--text2);margin-top:4px;">联系方式: {{h.contact}}</div>

        </div>
      </div>

            </div>

              <template v-if="uploading==='screenshots'"><span style="font-size:11px;text-align:center;padding:4px;line-height:1.4;">{{uploadProgress || '上传中...'}}</span></template>
              <template v-else><span style="font-size:24px;">+</span></template>
            </div>
          </div>

            <template v-if="!catForm.icon"><span style="font-size:24px;">+</span><span>上传分类图标</span></template>
            <template v-else><img :src="catForm.icon" alt="icon"><div class="up-tip">点击更换</div></template>
            <div v-if="uploading==='catIcon'" class="up-tip">上传中...</div>
          </div>
        </div>
        <div class="form-group"><label>颜色</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <div v-for="c in colors" :key="c" @click="catForm.color=c" :style="{width:'32px',height:'32px',borderRadius:'10px',background:c,cursor:'pointer',outline: catForm.color===c?'2px solid #333':'none',outlineOffset:'2px'}"></div>
          </div>
        </div>
        <div class="form-group"><label>排序</label><input v-model="catForm.sort_order" type="number"></div>
        <div class="modal-btns">
          <button class="btn-primary" @click="saveCat">保存</button>
          <button class="btn-ghost" @click="showCat=false">取消</button>
        </div>
      </div>
    </div>
    </div>

    <!-- 底部玻璃导航 -->
    <div class="bottom-nav">
      <button :class="{active: mainTab==='stats'}" @click="setMain('stats')"><span class="ic">📊</span><span>统计</span></button>
      <button :class="{active: mainTab==='apps'}" @click="setMain('apps')"><span class="ic">📱</span><span>软件</span></button>
      <button :class="{active: mainTab==='publish'}" @click="setMain('publish')"><span class="ic">📢</span><span>发布</span></button>
      <button :class="{active: mainTab==='settings'}" @click="setMain('settings')"><span class="ic">⚙️</span><span>设置</span></button>
    </div>
  </div>
</div>
</script>

<script>
const { createApp } = Vue;
const store = {
  get token() { return localStorage.getItem('fl_token') || ''; },
  set token(v) { localStorage.setItem('fl_token', v); },
  get user() { return localStorage.getItem('fl_user') || ''; },
  set user(v) { localStorage.setItem('fl_user', v); },
};

createApp({
  template: '#app-tpl',
  data() {
    return {
      token: store.token,
      username: '', password: '', loginErr: '',
      user: store.user,
      mainTab: 'stats',
      tab: 'stats',
      stats: {}, apps: [], cats: [], banners: [],
      showApp: false, showBanner: false, showCat: false,
      uploading: '',
      uploadProgress: '',
      colors: ['#4C6FFF', '#22B07D', '#FF8F1F', '#FF4D6D', '#7C4DFF', '#00B8D4', '#FFB300', '#F5455C'],
      appForm: { id: 0, name: '', category_id: 0, icon: '', version: '', description: '', screenshots: [], contributor_qq: '', package_name: '', sort_order: 0, is_active: 1, pack_id: null, is_top: 0, is_featured: 0, release_date: '', is_new: 0, links: [] },
      newFlagTouched: false, // 「新版本标」是否被手动改过 (没改过则让后端按版本变更自动标新)
      bannerForm: { id: 0, image: '', title: '', app_id: null, url: '', sort_order: 0, is_active: 1 },
      catForm: { id: 0, parent_id: 0, name: '', color: '#4C6FFF', icon: '', sort_order: 0 },
      verForm: { version: '1.0.0', url: '', update_log: '', update_mode: 'internal', force_update: 0, size_mb: 0, release_date: '' },
      noticeForm: { content: '', mode: 'daily', enabled: 0 },
      contribQQ: '',
      contribName: '',
      contribBio: '',
      contributors: [],
      showContrib: false,
      contribForm: { id: 0, qq: '', name: '', bio: '', sort_order: 0 },
      aboutForm: { qq_group: '', qq_key: '', qq_url: '', website: '', github: '', feedback: '', donate: '', banner_text: '风铃分享库 · 官方频道', banner_sub: '最新软件 · 更新通知 · 交流反馈' },
      crashes: [],
      harms: [],
    };
  },
  mounted() {
    if (this.token) { this.loadStats(); this.loadCats(); this.loadBanners(); }
  },
  created() {
    // 恢复上次所在主 tab (localStorage)
    const saved = localStorage.getItem('fl_mainTab');
    if (saved && ['stats','apps','publish','settings'].includes(saved)) this.mainTab = saved;
  },
  computed: {
    // 分类排序: 顶级在前, 子分类跟随父分类
    sortedCats() {
      return [...this.cats].sort((a, b) =>
        (a.parent_id || 0) - (b.parent_id || 0) || (a.sort_order || 0) - (b.sort_order || 0) || a.id - b.id);
    },
    // 顶级分类 (父分类下拉选项)
    topCats() {
      return this.cats.filter(c => !c.parent_id);
    },
  },
  methods: {
    /** 按 id 查分类名 (分类列表显示父分类名) */
    catName(id) {
      const c = this.cats.find(x => x.id === id);
      return c ? c.name : '';
    },
    async api(action, params = {}, method = 'GET') {
      let url = 'api.php?action=' + action;
      const opt = { method, headers: { 'Authorization': 'Bearer ' + this.token } };
      if (method === 'POST') {
        opt.headers['Content-Type'] = 'application/json';
        opt.body = JSON.stringify(params);
      } else {
        // GET 请求加时间戳, 防止浏览器 HTTP 强缓存返回旧数据 (改完刷新还是旧值问题)
        url += '&_=' + Date.now();
        const qs = new URLSearchParams(params).toString();
        if (qs) url += '&' + qs;
      }
      let res;
      try {
        res = await fetch(url, opt);
      } catch (e) {
        this.toast('网络错误: ' + e.message);
        return { code: -1, msg: '网络错误' };
      }
      let body;
      try { body = await res.json(); } catch (e) { body = { code: -1, msg: '响应解析失败' }; }
      // 401 (HTTP 或 body): token 失效, 强制重新登录
      if (res.status === 401 || body.code === 401) {
        store.token = ''; this.token = ''; store.user = '';
        this.toast('登录已失效, 请重新登录');
        return { code: 401, msg: '未登录' };
      }
      return body;
    },
    toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1800);
    },
    switchTab(t) {
      this.tab = t;
      // 子 tab 联动主 tab
      if (['stats'].includes(t)) this.mainTab = 'stats';
      if (['apps','banners','cats'].includes(t)) this.mainTab = 'apps';
      if (['version','notice'].includes(t)) this.mainTab = 'publish';
      if (['about','contrib','crash','harm'].includes(t)) this.mainTab = 'settings';
      if (t === 'stats') this.loadStats();
      if (t === 'apps') this.loadApps();
      if (t === 'banners') this.loadBanners();
      if (t === 'cats') this.loadCats();
      if (t === 'version') this.loadVersion();
      if (t === 'about') this.loadAbout();
      if (t === 'notice') this.loadNotice();
      if (t === 'contrib') this.loadContributors();
      if (t === 'crash') this.loadCrashReports();
      if (t === 'harm') this.loadHarmReports();
    },
    // 底部导航主 tab 切换
    setMain(m) {
      this.mainTab = m;
      localStorage.setItem('fl_mainTab', m);
      if (m === 'stats') {
        this.tab = 'stats';
        // 已有数据不再重复请求 (统计页刷新难受问题); 手动点刷新按钮才重拉
        if (!this.stats || !this.stats.total_apps) this.loadStats();
      }
      else if (m === 'apps') { if (!['apps','banners','cats'].includes(this.tab)) this.tab = 'apps'; this.loadApps(); }
      else if (m === 'publish') { if (!['version','notice'].includes(this.tab)) this.tab = 'version'; this.loadVersion(); }
      else if (m === 'settings') { if (!['about','contrib','crash','harm'].includes(this.tab)) this.tab = 'about'; this.loadAbout(); }
    },
    async loadCrashReports() {
      try {
        const r = await this.api('crash_reports', {}, 'POST');
        if (r.code === 0) this.crashes = r.data || [];
      } catch (e) { this.toast('崩溃日志加载失败'); }
    },
    async loadHarmReports() {
      try {
        const r = await this.api('harm_reports', {}, 'POST');
        if (r.code === 0) this.harms = r.data || [];
      } catch (e) { this.toast('反馈加载失败'); }
    },
    async markHarm(id, status) {
      try {
        const r = await this.api('harm_report_status', { id, status }, 'POST');
        if (r.code !== 0) { this.toast(r.msg || '操作失败'); return; }
        this.toast(status == 1 ? '已标记为已处理' : '已重新打开');
        this.loadHarmReports();
      } catch (e) { this.toast('操作失败'); }
    },
    async deleteHarm(id) {
      if (!confirm('确定删除这条反馈吗？')) return;
      try {
        const r = await this.api('harm_report_delete', { id }, 'POST');
        if (r.code !== 0) { this.toast(r.msg || '删除失败'); return; }
        this.toast('已删除');
        this.loadHarmReports();
      } catch (e) { this.toast('删除失败'); }
    },
    async loadContributors() {
      try {
        const r = await this.api('contributor_apps', {}, 'POST');
        if (r.code === 0) this.contributors = r.data || [];
      } catch (e) { this.toast('投稿名单加载失败'); }
    },
    async addContributor() {
      const qq = (this.contribQQ || '').trim();
      if (!qq) { this.toast('请输入 QQ 号'); return; }
      if (!/^\d{5,12}$/.test(qq)) { this.toast('QQ 号格式不正确'); return; }
      const r = await this.api('contributor_create', { qq, name: (this.contribName || '').trim(), bio: (this.contribBio || '').trim() }, 'POST');
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('添加失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.contribQQ = ''; this.contribName = ''; this.contribBio = '';
      this.toast('投稿人已添加');
      this.loadContributors();
    },
    editContributor(c) {
      this.contribForm = { id: c.id, qq: c.qq, name: c.name || '', bio: c.bio || '', sort_order: c.sort_order || 0 };
      this.showContrib = true;
    },
    async saveContributor() {
      const f = this.contribForm;
      const r = await this.api('contributor_update', { id: f.id, name: f.name || '', bio: f.bio || '', sort_order: Number(f.sort_order) || 0 }, 'POST');
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.showContrib = false;
      this.toast('已保存');
      this.loadContributors();
    },
    async delContributor(c) {
      if (!confirm('删除投稿人 ' + c.qq + '?')) return;
      const r = await this.api('contributor_delete', { id: c.id }, 'POST');
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('删除失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.toast('已删除');
      this.loadContributors();
    },
    async loadNotice() {
      try {
        const r = await fetch('api.php?action=notice_get&_=' + Date.now()).then(x => x.json());
        if (r.code === 0 && r.data) {
          this.noticeForm = { content: r.data.content || '', mode: r.data.mode || 'daily', enabled: Number(r.data.enabled) || 0 };
          // 回填富文本编辑器
          this.$nextTick(() => {
            const ed = document.getElementById('noticeEditor');
            if (ed) ed.innerHTML = this.noticeForm.content;
          });
        }
      } catch (e) { this.toast('公告加载失败'); }
    },
    // 富文本编辑命令
    execCmd(cmd, arg) {
      const ed = document.getElementById('noticeEditor');
      if (!ed) return;
      ed.focus();
      document.execCommand(cmd, false, arg);
      this.onNoticeInput();
    },
    insertLink() {
      const url = prompt('输入链接地址 (http:// 或 https:// 开头):', 'https://');
      if (!url) return;
      const text = prompt('输入链接文字:', '点击打开');
      if (!text) return;
      this.execCmd('insertHTML', `<a href="${url}" target="_blank">${text}</a>`);
    },
    insertNoticeImage() {
      // 复用 pickImage: 上传后插入图片
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        this.uploading = 'noticeImg';
        const fd = new FormData();
        fd.append('file', file);
        try {
          const res = await fetch('api.php?action=upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + this.token },
            body: fd,
          });
          const r = await res.json();
          if (r.code === 0 && r.data) {
            this.execCmd('insertImage', r.data.url);
            this.toast('图片已插入');
          } else this.toast(r.msg || '上传失败');
        } catch (err) { this.toast('上传失败'); }
        this.uploading = '';
      };
      input.click();
    },
    onNoticeInput() {
      const ed = document.getElementById('noticeEditor');
      if (ed) this.noticeForm.content = ed.innerHTML;
    },
    async saveNotice() {
      const f = this.noticeForm;
      // 从编辑器同步内容 (确保 contenteditable 最新)
      const ed = document.getElementById('noticeEditor');
      if (ed) f.content = ed.innerHTML;
      const clean = (f.content || '').replace(/<br\s*\/?>/gi, '').replace(/&nbsp;/g, '').replace(/<[^>]+>/g, '').trim();
      if (!clean) { this.toast('请填写公告内容'); return; }
      const r = await this.api('notice_set', { content: f.content, mode: f.mode, enabled: Number(f.enabled) ? 1 : 0 }, 'POST');
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.toast('公告已保存');
    },
    async loadAbout() {
      try {
        const r = await fetch('api.php?action=about_config_get').then(x => x.json());
        if (r.code === 0 && r.data) {
          this.aboutForm = { ...this.aboutForm, ...r.data };
        }
      } catch (e) { this.toast('关于配置加载失败'); }
    },
    async saveAbout() {
      const f = this.aboutForm;
      const r = await this.api('about_config_set', { qq_group: f.qq_group, qq_key: f.qq_key, qq_url: f.qq_url, website: f.website, github: f.github, feedback: f.feedback, donate: f.donate, banner_text: f.banner_text, banner_sub: f.banner_sub }, 'POST');
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.toast('关于配置已保存');
    },
    async loadVersion() {
      try {
        const r = await fetch('api.php?action=version').then(x => x.json());
        if (r.code === 0 && r.data) {
          this.verForm = { version: r.data.version || '1.0.0', url: r.data.url || '', update_log: r.data.update_log || '', update_mode: r.data.update_mode || 'internal', force_update: Number(r.data.force_update) || 0, size_mb: Number(r.data.size_mb) || 0, release_date: r.data.release_date || '' };
        }
      } catch (e) { this.toast('版本信息加载失败'); }
    },
    // APK 上传
    pickApk() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.apk';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 200 * 1024 * 1024) { this.toast('APK 超过 200MB'); return; }
        this.uploading = 'apk';
        const fd = new FormData();
        fd.append('file', file);
        try {
          const res = await fetch('api.php?action=upload_apk', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + this.token },
            body: fd,
          });
          const r = await res.json();
          if (r.code === 0 && r.data) {
            this.verForm.url = r.data.url;
            this.toast('APK 上传成功');
          } else if (r.code !== 401) this.toast(r.msg || '上传失败');
        } catch (err) { this.toast('上传失败'); }
        this.uploading = '';
      };
      input.click();
    },
    async saveVersion() {
      const f = this.verForm;
      if (!f.version) { this.toast('请输入版本号'); return; }
      if (!f.url) { this.toast('请上传 APK 或填写外链下载地址'); return; }
      const r = await this.api('version_update', { version: f.version, url: f.url, update_log: f.update_log, update_mode: f.update_mode || 'internal', force_update: Number(f.force_update) || 0, size_mb: Number(f.size_mb) || 0, release_date: f.release_date || '' }, 'POST');
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('发布失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.toast('版本发布成功: v' + f.version);
    },
    async login() {
      this.loginErr = '';
      if (!this.username || !this.password) { this.loginErr = '请输入用户名和密码'; return; }
      const r = await this.api('login', { username: this.username, password: this.password }, 'POST');
      if (r.code === 0 && r.data && r.data.token) {
        store.token = r.data.token;
        store.user = (r.data.user && r.data.user.username) || this.username;
        this.token = r.data.token;
        this.user = store.user;
        this.toast('登录成功, 欢迎 ' + this.user);
        this.loadStats(); this.loadCats(); this.loadBanners();
      } else {
        this.loginErr = r.msg || '登录失败';
      }
    },
    logout() { store.token = ''; this.token = ''; store.user = ''; this.user = ''; },
    async loadStats() {
      if (this._statsLoading) return; // 防止重复请求
      this._statsLoading = true;
      try {
        const r = await this.api('stats');
        if (r.code === 0) this.stats = r.data;
      } finally { this._statsLoading = false; }
    },
    async loadApps() { const r = await fetch('api.php?action=apps&_=' + Date.now(), { headers: { 'Authorization': 'Bearer ' + this.token } }).then(x => x.json()); if (r.code === 0) this.apps = r.data; },
    async loadBanners() { const r = await fetch('api.php?action=banners&_=' + Date.now()).then(x => x.json()); if (r.code === 0) this.banners = r.data; },
    async loadCats() { const r = await fetch('api.php?action=categories&_=' + Date.now()).then(x => x.json()); if (r.code === 0) this.cats = r.data; },
    // 图片上传 (直接选文件, 不是填 URL)
    pickImage(target) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      // 介绍图支持一次多选, 其他目标单选
      input.multiple = (target === 'screenshots');
      input.onchange = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const multi = target === 'screenshots' && files.length > 1;
        this.uploading = target;
        let uploaded = 0;
        for (let fi = 0; fi < files.length; fi++) {
          const file = files[fi];
          if (multi) this.uploadProgress = `上传中 ${fi + 1}/${files.length}...`;
          const fd = new FormData();
          fd.append('file', file);
          try {
            const res = await fetch('api.php?action=upload', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + this.token },
              body: fd,
            });
            const r = await res.json();
            if (r.code === 0) {
              if (target === 'icon') this.appForm.icon = r.data.url;
              else if (target === 'banner') this.bannerForm.image = r.data.url;
              else if (target === 'catIcon') this.catForm.icon = r.data.url;
              else if (target === 'screenshots') {
                if (!this.appForm.screenshots) this.appForm.screenshots = [];
                this.appForm.screenshots.push(r.data.url);
              }
              uploaded++;
            } else this.toast(r.msg);
          } catch (err) { this.toast('上传失败: ' + file.name); }
        }
        if (multi) this.toast(`已上传 ${uploaded}/${files.length} 张`);
        else if (uploaded > 0) this.toast('上传成功');
        this.uploading = '';
        this.uploadProgress = '';
      };
      input.click();
    },
    // 软件
    async openApp(app) {
      this.newFlagTouched = false;
      this.appForm = {
        id: app ? app.id : 0, name: app ? app.name : '', category_id: app ? (Number(app.category_id) || 0) : 0,
        icon: app ? app.icon : '', version: app ? app.version : '', description: app ? app.description : '',
        screenshots: (app && app.screenshots) ? [...app.screenshots] : [],
        contributor_qq: app ? (app.contributor_qq || '') : '',
        package_name: app ? app.package_name : '', sort_order: app ? app.sort_order : 0,
        is_active: app ? Number(app.is_active) : 1, pack_id: app ? (app.pack_id || null) : null,
        is_top: app ? Number(app.is_top) : 0, is_featured: app ? Number(app.is_featured) : 0,
        release_date: app ? (app.release_date || '') : '',
        is_new: app ? Number(app.is_new) : 0,
        links: [],
      };
      this.showApp = true;
      // 编辑已有软件: 异步加载详情(含网盘链接), 否则编辑时链接不可见
      if (app && app.id) {
        try {
          const r = await fetch('api.php?action=app_detail&id=' + app.id + '&_=' + Date.now(), {
            headers: { 'Authorization': 'Bearer ' + this.token }
          }).then(x => x.json());
          if (r.code === 0 && r.data) {
            const d = r.data;
            this.appForm = {
              ...this.appForm,
              name: d.name || this.appForm.name,
              icon: d.icon || this.appForm.icon,
              version: d.version || this.appForm.version,
              description: d.description || this.appForm.description,
              screenshots: (d.screenshots && d.screenshots.length) ? [...d.screenshots] : this.appForm.screenshots,
              contributor_qq: d.contributor_qq !== undefined ? (d.contributor_qq || '') : this.appForm.contributor_qq,
              package_name: d.package_name || this.appForm.package_name,
              pack_id: d.pack_id || null,
              is_top: Number(d.is_top) || 0,
              is_featured: Number(d.is_featured) || 0,
              release_date: d.release_date || '',
              is_new: Number(d.is_new) || 0,
              links: (d.pan_links || []).map(l => ({ ...l, _k: 'l' + l.id + Math.random(), _editing: false })),
            };
            // 记录原始链接 id (用于检测保存时被删除的链接)
            this._origLinkIds = (d.pan_links || []).map(l => l.id);
          }
        } catch (e) { this.toast('详情加载失败'); }
      } else {
        this._origLinkIds = [];
      }
    },
    addLink() {
      this.appForm.links.push({ pan_type: 'uc', label: 'UC网盘', url: '', password: '', _new: true, _k: 'n' + Date.now() + Math.random(), _editing: true });
    },
    async saveApp() {
      const f = this.appForm;
      if (!f.name) { this.toast('请输入软件名'); return; }
      // 已有链接先更新
      for (const link of f.links) {
        if (link.id && !link._new) {
          const r = await this.api('link_update', { id: link.id, pan_type: link.pan_type, label: link.label, url: link.url, password: link.password }, 'POST');
          if (r.code !== 0 && r.code !== 401) { this.toast('链接更新失败: ' + r.msg); return; }
        }
      }
      // 删除被移除的链接 (编辑时链接在但保存前被删掉的情况)
      if (f.id && this._origLinkIds) {
        const keptIds = new Set(f.links.filter(l => l.id).map(l => l.id));
        for (const oldId of this._origLinkIds) {
          if (!keptIds.has(oldId)) {
            await this.api('link_delete', { id: oldId }, 'POST');
          }
        }
      }
      let r;
      if (f.id) {
        r = await this.api('app_update', { id: f.id, name: f.name, category_id: f.category_id || null, icon: f.icon, version: f.version, description: f.description, screenshots: JSON.stringify(f.screenshots || []), contributor_qq: f.contributor_qq || '', package_name: f.package_name, sort_order: Number(f.sort_order) || 0, is_active: Number(f.is_active), pack_id: f.pack_id || null, is_top: Number(f.is_top) || 0, is_featured: Number(f.is_featured) || 0, release_date: f.release_date || '', ...(this.newFlagTouched ? { new_flag: Number(f.is_new) ? 1 : 0 } : {}) }, 'POST');
      } else {
        r = await this.api('app_create', { name: f.name, category_id: f.category_id || null, icon: f.icon, version: f.version, description: f.description, screenshots: JSON.stringify(f.screenshots || []), contributor_qq: f.contributor_qq || '', package_name: f.package_name, sort_order: Number(f.sort_order) || 0, pack_id: f.pack_id || null, is_top: Number(f.is_top) || 0, is_featured: Number(f.is_featured) || 0, release_date: f.release_date || '', ...(this.newFlagTouched ? { new_flag: Number(f.is_new) ? 1 : 0 } : {}) }, 'POST');
        if (r.code === 0 && r.data) f.id = r.data.id;
      }
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      // 新建链接
      for (const link of f.links) {
        if (link._new && link.url) {
          const lr = await this.api('link_create', { app_id: f.id, pan_type: link.pan_type, label: link.label, url: link.url, password: link.password }, 'POST');
          if (lr.code !== 0 && lr.code !== 401) { this.toast('链接保存失败: ' + lr.msg); return; }
        }
      }
      this.showApp = false;
      this.toast('保存成功');
      this.loadApps();
    },
    async delApp(app) {
      if (!confirm('删除软件 ' + app.name + '?')) return;
      await this.api('app_delete', { id: app.id }, 'POST');
      this.loadApps();
    },
    // 轮播
    openBanner(b) {
      if (b) {
        this.bannerForm = { ...b, app_id: b.app_id || null };
      } else {
        this.bannerForm = { id: 0, image: '', title: '', app_id: null, url: '', sort_order: 0, is_active: 1 };
      }
      this.showBanner = true;
    },
    async saveBanner() {
      const f = this.bannerForm;
      if (!f.image) { this.toast('请上传图片'); return; }
      let r;
      if (f.id) {
        r = await this.api('banner_update', { id: f.id, image: f.image, title: f.title, app_id: f.app_id || null, url: f.url || '', sort_order: Number(f.sort_order) || 0, is_active: Number(f.is_active) }, 'POST');
      } else {
        r = await this.api('banner_create', { image: f.image, title: f.title, app_id: f.app_id || null, url: f.url || '', sort_order: Number(f.sort_order) || 0, is_active: Number(f.is_active) }, 'POST');
      }
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.showBanner = false;
      this.toast('保存成功');
      this.loadBanners();
    },
    async delBanner(b) {
      if (!confirm('删除该轮播?')) return;
      await this.api('banner_delete', { id: b.id }, 'POST');
      this.loadBanners();
    },
    // 分类
    editCat(c) {
      this.catForm = c ? { ...c, parent_id: c.parent_id || 0 } : { id: 0, parent_id: 0, name: '', color: '#4C6FFF', icon: '', sort_order: 0 };
      this.showCat = true;
    },
    async saveCat() {
      const f = this.catForm;
      if (!f.name) { this.toast('请输入分类名'); return; }
      let r;
      if (f.id) {
        r = await this.api('category_update', { id: f.id, name: f.name, parent_id: Number(f.parent_id) || 0, color: f.color, icon: f.icon || '', sort_order: Number(f.sort_order) || 0 }, 'POST');
      } else {
        r = await this.api('category_create', { name: f.name, parent_id: Number(f.parent_id) || 0, color: f.color, icon: f.icon || '', sort_order: Number(f.sort_order) || 0 }, 'POST');
      }
      if (r.code !== 0) {
        if (r.code !== 401) this.toast('保存失败: ' + (r.msg || '未知错误'));
        return;
      }
      this.showCat = false;
      this.toast('保存成功');
      this.loadCats();
    },
    async delCat(c) {
      if (!confirm('删除分类 ' + c.name + '?')) return;
      await this.api('category_delete', { id: c.id }, 'POST');
      this.loadCats();
    },
  },
}).mount('#app');
</script>
</body>
</html>
